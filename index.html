<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>СУШИ КЛУБ</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f0e0d;
            color: #ffffff;
        }
        /* Вертикальная рамка под постер/фото, чтобы весь кадр помещался целиком */
        .product-image-box {
            width: 100%;
            aspect-ratio: 3 / 4;
            background-color: #11100f;
            overflow: hidden;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .product-image-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: center center;
            transition: transform 0.3s ease;
        }
        .product-card:hover .product-image-box img {
            transform: scale(1.03);
        }
        .cat-btn { background:#1c1917; border:1px solid #44403c; color:#e7e5e4; }
        .cat-btn.active { background:#f59e0b; border-color:#f59e0b; color:#000; }
    </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-amber-500 selection:text-black">

    <!-- Шапка сайта -->
    <header class="sticky top-0 z-40 bg-[#141210]/95 backdrop-blur-md border-b border-stone-800/80">
        <div class="max-w-3xl mx-auto px-4 h-16 flex items-center justify-between gap-2">
            <!-- Новый логотип -->
            <div class="flex items-center gap-2.5 cursor-pointer" onclick="scrollToTop()">
                <svg class="w-10 h-10 shrink-0" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" aria-label="Суши Клуб">
                    <defs>
                        <linearGradient id="lg-gold" x1="0" y1="0" x2="1" y2="1">
                            <stop offset="0" stop-color="#fcd34d"/>
                            <stop offset="1" stop-color="#d97706"/>
                        </linearGradient>
                    </defs>
                    <circle cx="24" cy="24" r="22.5" fill="#1c1917" stroke="url(#lg-gold)" stroke-width="2"/>
                    <circle cx="24" cy="24" r="19" fill="none" stroke="#f59e0b" stroke-opacity=".35" stroke-width=".8" stroke-dasharray="2 2.5"/>
                    <!-- ролл -->
                    <circle cx="24" cy="25" r="12" fill="#0b0b0b" stroke="url(#lg-gold)" stroke-width="1.2"/>
                    <circle cx="24" cy="25" r="9.2" fill="#f7f1e3"/>
                    <circle cx="24" cy="25" r="5.4" fill="#fb7c3c"/>
                    <circle cx="22.4" cy="23.6" r="1.6" fill="#fdba74"/>
                    <circle cx="26.6" cy="26.6" r="1.7" fill="#84cc16"/>
                    <!-- палочки -->
                    <line x1="8" y1="9" x2="22" y2="13.5" stroke="url(#lg-gold)" stroke-width="1.8" stroke-linecap="round"/>
                    <line x1="11" y1="6.5" x2="25" y2="11" stroke="url(#lg-gold)" stroke-width="1.8" stroke-linecap="round"/>
                </svg>
                <div class="leading-tight font-extrabold tracking-wide text-amber-400 text-sm sm:text-base uppercase">
                    СУШИ<br>КЛУБ
                </div>
            </div>

            <!-- Кнопки справа -->
            <div class="flex items-center gap-2">
                <button onclick="toggleAdminMode()" id="btn-admin-toggle" class="bg-[#1c1917] hover:bg-stone-800 border border-stone-700/80 text-stone-200 px-3.5 py-2 rounded-xl text-xs font-semibold flex flex-col items-center justify-center min-w-[82px] transition-colors">
                    <i class="fa-solid fa-lock text-amber-400 text-xs mb-0.5" id="admin-lock-icon"></i>
                    <span>Админка</span>
                </button>

                <button onclick="openCart()" class="relative bg-[#f59e0b] hover:bg-amber-400 text-black px-4 py-2 rounded-xl text-xs font-bold flex flex-col items-center justify-center min-w-[86px] shadow-lg shadow-amber-500/20 transition-all">
                    <i class="fa-solid fa-cart-shopping text-xs mb-0.5"></i>
                    <span>Корзина</span>
                    <span id="cart-badge" class="absolute -top-1.5 -right-1.5 bg-red-600 text-white text-[10px] font-extrabold w-5 h-5 rounded-full flex items-center justify-center shadow hidden">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Время работы -->
    <div class="max-w-3xl mx-auto w-full px-4 pt-3">
        <div class="bg-[#181512] border border-stone-800 rounded-2xl px-3.5 py-2.5 flex items-center justify-between text-xs">
            <span class="text-stone-300"><i class="fa-regular fa-clock text-amber-400 mr-1.5"></i>Время работы: <b class="text-white">17:00 – 22:00</b></span>
            <span id="work-status" class="font-semibold"></span>
        </div>
    </div>

    <!-- Категории -->
    <div class="max-w-3xl mx-auto w-full px-4 pt-3">
        <div class="grid grid-cols-3 gap-2">
            <button onclick="setCategory('rolls')" data-cat="rolls" class="cat-btn active py-2.5 rounded-xl text-sm font-bold transition-colors">🍣 Роллы</button>
            <button onclick="setCategory('sets')" data-cat="sets" class="cat-btn py-2.5 rounded-xl text-sm font-bold transition-colors">🍱 Сеты</button>
            <button onclick="setCategory('drinks')" data-cat="drinks" class="cat-btn py-2.5 rounded-xl text-sm font-bold transition-colors">🥤 Напитки</button>
        </div>
    </div>

    <!-- Панель добавления нового товара (появляется после ввода кода 7777) -->
    <div id="admin-bar" class="hidden max-w-3xl mx-auto w-full px-4 pt-4">
        <div class="bg-[#181512] border border-amber-500/40 rounded-2xl p-3.5 flex items-center justify-between gap-3">
            <div class="text-xs text-amber-300 font-medium">
                <i class="fa-solid fa-shield-halved mr-1"></i> Режим редактирования включён
            </div>
            <div class="flex items-center gap-2 flex-wrap">
                <button onclick="openProductModal()" class="bg-[#f59e0b] hover:bg-amber-400 text-black font-bold px-3.5 py-2 rounded-xl text-xs flex items-center gap-1.5 transition-colors">
                    <i class="fa-solid fa-plus"></i> Добавить в раздел
                </button>
                <button onclick="resetMenu()" class="bg-stone-800 hover:bg-stone-700 text-amber-300 font-semibold px-3 py-2 rounded-xl text-xs transition-colors">
                    Сбросить меню
                </button>
                <button onclick="toggleAdminMode()" class="bg-stone-800 hover:bg-stone-700 text-stone-200 font-semibold px-3 py-2 rounded-xl text-xs transition-colors">
                    Выйти
                </button>
            </div>
        </div>
    </div>

    <!-- Основной список карточек -->
    <main class="flex-grow max-w-3xl mx-auto w-full px-4 py-4">
        <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <!-- Карточки рендерятся через JS -->
        </div>
    </main>

    <!-- Модальное окно Корзины -->
    <div id="cart-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-[#181512] border border-stone-800 w-full max-w-md rounded-t-3xl sm:rounded-3xl max-h-[90vh] flex flex-col shadow-2xl">
            <div class="p-4 border-b border-stone-800 flex items-center justify-between">
                <h3 class="text-base font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-cart-shopping text-amber-400"></i> Корзина
                </h3>
                <button onclick="closeCart()" class="w-8 h-8 rounded-xl bg-stone-800 text-stone-400 hover:text-white flex items-center justify-center">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <div id="cart-items" class="p-4 overflow-y-auto flex-grow space-y-3 divide-y divide-stone-800/60">
                <!-- Товары в корзине -->
            </div>

            <div class="p-4 border-t border-stone-800 bg-[#141210] space-y-3 rounded-b-3xl">
                <div class="flex justify-between items-center text-sm font-bold">
                    <span class="text-stone-400">Итого:</span>
                    <span id="cart-total" class="text-lg text-amber-400 font-extrabold">0 ₽</span>
                </div>

                <div id="checkout-fields" class="space-y-2.5 hidden">
                    <input type="text" id="cust-name" placeholder="Ваше имя" class="w-full bg-[#0f0e0d] border border-stone-800 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-amber-500">
                    <input type="tel" id="cust-phone" placeholder="Ваш телефон или @username" class="w-full bg-[#0f0e0d] border border-stone-800 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-amber-500">
                    <input type="text" id="cust-address" placeholder="Адрес доставки" class="w-full bg-[#0f0e0d] border border-stone-800 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-amber-500">
                </div>

                <button id="btn-checkout-step" onclick="handleCheckout()" class="w-full bg-[#f59e0b] hover:bg-amber-400 text-black font-bold py-3 rounded-xl text-sm transition-colors">
                    Оформить заказ
                </button>
            </div>
        </div>
    </div>

    <!-- Модальное окно Редактирования / Добавления товара -->
    <div id="product-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-[#181512] border border-stone-800 rounded-3xl w-full max-w-md p-5 shadow-2xl space-y-4 max-h-[92vh] overflow-y-auto">
            <div class="flex items-center justify-between">
                <h3 id="modal-title" class="text-base font-bold text-white">Редактировать ролл</h3>
                <button onclick="closeProductModal()" class="w-8 h-8 rounded-xl bg-stone-800 text-stone-400 hover:text-white flex items-center justify-center">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <form id="product-form" onsubmit="saveProduct(event)" class="space-y-3 text-xs">
                <input type="hidden" id="edit-id">
                <div>
                    <label class="block text-stone-400 mb-1">Название</label>
                    <input type="text" id="p-name" required class="w-full bg-[#0f0e0d] border border-stone-800 rounded-xl px-3.5 py-2.5 text-white focus:outline-none focus:border-amber-500">
                </div>
                <div>
                    <label class="block text-stone-400 mb-1">Состав / Описание</label>
                    <textarea id="p-desc" rows="2" required class="w-full bg-[#0f0e0d] border border-stone-800 rounded-xl px-3.5 py-2.5 text-white focus:outline-none focus:border-amber-500"></textarea>
                </div>
                <div>
                    <label class="block text-stone-400 mb-1">Цена (₽)</label>
                    <input type="number" id="p-price" required class="w-full bg-[#0f0e0d] border border-stone-800 rounded-xl px-3.5 py-2.5 text-white focus:outline-none focus:border-amber-500">
                </div>
                <div>
                    <label class="block text-stone-400 mb-1">Фото из галереи iPhone или ссылка</label>

                    <!-- Кнопка выбора из галереи + предпросмотр -->
                    <div class="flex items-center gap-3 mb-2">
                        <label for="p-file" class="cursor-pointer bg-[#221e1b] hover:bg-stone-800 border border-amber-500/40 text-amber-400 font-semibold px-3.5 py-2.5 rounded-xl flex items-center gap-2 transition-colors">
                            <i class="fa-solid fa-images"></i>
                            <span>Выбрать из галереи</span>
                        </label>
                        <input type="file" id="p-file" accept="image/*" onchange="handleImageUpload(event)" class="hidden">

                        <img id="p-preview" src="" alt="Предпросмотр" class="w-12 h-14 object-contain rounded-lg bg-[#0f0e0d] border border-stone-800 hidden">
                    </div>

                    <input type="text" id="p-image" oninput="updateModalPreview()" placeholder="Автозаполнится после выбора фото или вставь ссылку" class="w-full bg-[#0f0e0d] border border-stone-800 rounded-xl px-3.5 py-2.5 text-white focus:outline-none focus:border-amber-500">
                </div>

                <button type="submit" class="w-full bg-[#f59e0b] hover:bg-amber-400 text-black font-bold py-3 rounded-xl text-sm transition-colors mt-2">
                    Сохранить
                </button>
            </form>
        </div>
    </div>

    <script>
        const TELEGRAM_BOT_TOKEN = '9148908353:AAGKG1RkIojw1DhpKcS0w1w7pQYdcf0Rxeg';
        const TELEGRAM_CHAT_ID = '997853065';

        const defaultProducts = [
            {
                id: 1,
                category: "rolls",
                name: "Филадельфия",
                desc: "Нежный лосось, сливочный сыр, филадельфия, огурец, рис, нори.",
                price: 12000,
                image: "IMG_8710.png"
            },
            {
                id: 2,
                category: "rolls",
                name: "Калифорния с крабом",
                desc: "Снежный краб, авокадо, огурец, икра тобико, японский майонез, рис, нори.",
                price: 11000,
                image: "https://images.unsplash.com/photo-1579871494447-9811cf80d66c?auto=format&fit=crop&w=800&q=85"
            },
            {
                id: 3,
                category: "rolls",
                name: "Канадский ролл",
                desc: "Копченый угорь, лосось, сливочный сыр, авокадо, соус унаги, кунжут.",
                price: 13500,
                image: "https://images.unsplash.com/photo-1611143669185-af224c5e3252?auto=format&fit=crop&w=800&q=85"
            },
            {
                id: 4,
                category: "rolls",
                name: "Ролл с лососем и авокадо",
                desc: "Свежий лосось, спелый авокадо, творожный сыр, рис, нори.",
                price: 11500,
                image: "https://images.unsplash.com/photo-1553621042-f6e147245754?auto=format&fit=crop&w=800&q=85"
            }
        ];

        let parsedProducts = null;
        try { parsedProducts = JSON.parse(localStorage.getItem('sushi_club_products_v5')); } catch (e) {}
        let products = (Array.isArray(parsedProducts) && parsedProducts.length > 0) ? parsedProducts : defaultProducts;
        let cart = JSON.parse(localStorage.getItem('sushi_club_cart_v5')) || [];
        let isAdmin = false;
        let activeCategory = 'rolls';

        const categoryNames = { rolls: 'ролл', sets: 'сет', drinks: 'напиток' };

        document.addEventListener('DOMContentLoaded', () => {
            renderProducts();
            updateCartBadge();
            updateAdminUI();
            updateWorkStatus();
            setInterval(updateWorkStatus, 60000);
        });

        // Время работы 17:00–22:00
        function updateWorkStatus() {
            const now = new Date();
            const mins = now.getHours() * 60 + now.getMinutes();
            const open = mins >= 17 * 60 && mins < 22 * 60;
            const el = document.getElementById('work-status');
            el.innerHTML = open
                ? '<span class="text-green-400">● Открыто</span>'
                : '<span class="text-red-400">● Закрыто</span>';
        }

        function setCategory(cat) {
            activeCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(b => {
                b.classList.toggle('active', b.dataset.cat === cat);
            });
            renderProducts();
        }

        function saveProductsStorage() {
            try {
                localStorage.setItem('sushi_club_products_v5', JSON.stringify(products));
                return true;
            } catch (err) {
                alert('Память браузера заполнена! Попробуйте удалить старые загруженные фото или сбросить меню.');
                return false;
            }
        }

        function scrollToTop() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function toggleAdminMode() {
            if (!isAdmin) {
                const pin = prompt("Введите PIN-код администратора:");
                if (pin !== "7777") {
                    if (pin !== null) alert("Неверный код доступа");
                    return;
                }
                isAdmin = true;
            } else {
                isAdmin = false;
            }
            updateAdminUI();
            renderProducts();
        }

        function updateAdminUI() {
            const adminBar = document.getElementById('admin-bar');
            const lockIcon = document.getElementById('admin-lock-icon');
            if (isAdmin) {
                adminBar.classList.remove('hidden');
                lockIcon.className = "fa-solid fa-lock-open text-amber-400 text-xs mb-0.5";
            } else {
                adminBar.classList.add('hidden');
                lockIcon.className = "fa-solid fa-lock text-stone-400 text-xs mb-0.5";
            }
        }

        function resetMenu() {
            if (confirm("Восстановить исходное меню?")) {
                products = [...defaultProducts];
                saveProductsStorage();
                renderProducts();
            }
        }

        function renderProducts() {
            const grid = document.getElementById('products-grid');
            const list = products.filter(p => (p.category || 'rolls') === activeCategory);

            if (list.length === 0) {
                grid.innerHTML = `<div class="col-span-full py-16 text-center text-stone-500 text-sm">Здесь скоро появятся новые позиции</div>`;
                return;
            }

            grid.innerHTML = list.map(p => `
                <div class="product-card bg-[#181512] border border-stone-800/90 rounded-2xl overflow-hidden flex flex-col shadow-xl">
                    <!-- Вертикальная рамка под фотографию/постер -->
                    <div class="product-image-box">
                        <img src="${p.image}" alt="${p.name}" loading="lazy">
                    </div>

                    <!-- Компактная область текста и кнопок -->
                    <div class="p-3.5 flex flex-col flex-grow justify-between">
                        <div>
                            <h3 class="text-base font-bold text-white leading-snug mb-1">${p.name}</h3>
                            <p class="text-xs text-stone-400 leading-tight line-clamp-2 mb-2">${p.desc}</p>
                        </div>

                        <div>
                            <div class="text-base font-extrabold text-[#f59e0b] mb-2.5">${p.price} ₽</div>

                            <button onclick="addToCart(${p.id})" class="w-full bg-[#f59e0b] hover:bg-amber-400 active:scale-[0.99] text-black font-bold py-2.5 rounded-xl text-xs sm:text-sm transition-all shadow-md shadow-amber-500/10">
                                В корзину
                            </button>

                            ${isAdmin ? `
                            <div class="grid grid-cols-2 gap-2 mt-2">
                                <button onclick="openProductModal(${p.id})" class="bg-[#221e1b] hover:bg-stone-800 border border-stone-700/70 text-amber-400 py-1.5 rounded-xl text-xs font-medium flex items-center justify-center gap-1.5 transition-colors">
                                    <span>✏️</span> Изменить
                                </button>
                                <button onclick="deleteProduct(${p.id})" class="bg-[#291717] hover:bg-red-950/60 border border-red-900/40 text-stone-300 hover:text-red-300 py-1.5 rounded-xl text-xs font-medium flex items-center justify-center gap-1.5 transition-colors">
                                    <span>🗑️</span> Удалить
                                </button>
                            </div>
                            ` : ''}
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Корзина
        function addToCart(id) {
            const product = products.find(p => p.id === id);
            if (!product) return;

            const existing = cart.find(i => i.id === id);
            if (existing) {
                existing.qty += 1;
            } else {
                cart.push({ ...product, qty: 1 });
            }
            saveCart();
            updateCartBadge();
        }

        function updateQty(id, delta) {
            const item = cart.find(i => i.id === id);
            if (!item) return;
            item.qty += delta;
            if (item.qty <= 0) {
                cart = cart.filter(i => i.id !== id);
            }
            saveCart();
            updateCartBadge();
            renderCart();
        }

        function saveCart() {
            localStorage.setItem('sushi_club_cart_v5', JSON.stringify(cart));
        }

        function updateCartBadge() {
            const totalQty = cart.reduce((sum, i) => sum + i.qty, 0);
            const badge = document.getElementById('cart-badge');
            badge.textContent = totalQty;
            if (totalQty > 0) {
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }
        }

        function openCart() {
            document.getElementById('checkout-fields').classList.add('hidden');
            document.getElementById('btn-checkout-step').textContent = 'Оформить заказ';
            renderCart();
            document.getElementById('cart-modal').classList.remove('hidden');
        }

        function closeCart() {
            document.getElementById('cart-modal').classList.add('hidden');
        }

        function renderCart() {
            const container = document.getElementById('cart-items');
            const totalEl = document.getElementById('cart-total');

            if (cart.length === 0) {
                container.innerHTML = `<div class="py-10 text-center text-stone-500 text-xs">Корзина пока пуста</div>`;
                totalEl.textContent = '0 ₽';
                return;
            }

            const total = cart.reduce((sum, i) => sum + i.price * i.qty, 0);
            totalEl.textContent = `${total} ₽`;

            container.innerHTML = cart.map(i => `
                <div class="pt-3 first:pt-0 flex items-center justify-between gap-3">
                    <div class="flex items-center gap-2.5">
                        <img src="${i.image}" class="w-12 h-12 rounded-xl object-cover bg-stone-900">
                        <div>
                            <div class="text-xs font-bold text-white">${i.name}</div>
                            <div class="text-xs text-amber-400 font-semibold">${i.price * i.qty} ₽</div>
                        </div>
                    </div>
                    <div class="flex items-center gap-1.5 bg-[#0f0e0d] border border-stone-800 rounded-xl p-1">
                        <button onclick="updateQty(${i.id}, -1)" class="w-6 h-6 rounded-lg bg-stone-800 text-white text-xs font-bold">-</button>
                        <span class="w-5 text-center text-xs font-bold">${i.qty}</span>
                        <button onclick="updateQty(${i.id}, 1)" class="w-6 h-6 rounded-lg bg-stone-800 text-white text-xs font-bold">+</button>
                    </div>
                </div>
            `).join('');
        }

        async function handleCheckout() {
            if (cart.length === 0) return;
            const fields = document.getElementById('checkout-fields');
            const btn = document.getElementById('btn-checkout-step');

            if (fields.classList.contains('hidden')) {
                fields.classList.remove('hidden');
                btn.textContent = 'Отправить заказ в Telegram';
                return;
            }

            const name = document.getElementById('cust-name').value.trim() || 'Клиент';
            const phone = document.getElementById('cust-phone').value.trim() || 'Не указан';
            const address = document.getElementById('cust-address').value.trim() || 'Самовывоз';
            const total = cart.reduce((sum, i) => sum + i.price * i.qty, 0);

            const orderLines = cart.map(i => `• ${i.name} x${i.qty} — ${i.price * i.qty} ₽`).join('\n');
            const summary = `🍣 Новый заказ — СУШИ КЛУБ\n\n${orderLines}\n\n💰 Итого: ${total} ₽\n👤 Имя: ${name}\n📞 Контакт: ${phone}\n📍 Адрес: ${address}`;

            btn.disabled = true;
            btn.textContent = 'Отправляем...';

            try {
                const res = await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: TELEGRAM_CHAT_ID,
                        text: summary
                    })
                });
                const data = await res.json();

                if (!data.ok) {
                    throw new Error(data.description || 'Ошибка Telegram API');
                }

                alert('Заказ отправлен в Telegram! Скоро свяжемся с вами.');
                cart = [];
                saveCart();
                updateCartBadge();
                closeCart();
            } catch (err) {
                if (navigator.clipboard) {
                    navigator.clipboard.writeText(summary).catch(() => {});
                }
                alert('Не удалось отправить напрямую (' + err.message + '). Заказ скопирован в буфер — откроется чат @olegchjen.');
                window.open('https://t.me/olegchjen', '_blank');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Отправить заказ в Telegram';
            }
        }

        // Редактирование и добавление товаров
        function updateModalPreview() {
            const val = document.getElementById('p-image').value.trim();
            const preview = document.getElementById('p-preview');
            if (val) {
                preview.src = val;
                preview.classList.remove('hidden');
            } else {
                preview.src = '';
                preview.classList.add('hidden');
            }
        }

        function openProductModal(id = null) {
            const modal = document.getElementById('product-modal');
            const title = document.getElementById('modal-title');
            document.getElementById('product-form').reset();
            document.getElementById('p-file').value = '';

            if (id) {
                const p = products.find(item => item.id === id);
                if (!p) return;
                title.textContent = 'Изменить позицию';
                document.getElementById('edit-id').value = p.id;
                document.getElementById('p-name').value = p.name;
                document.getElementById('p-desc').value = p.desc;
                document.getElementById('p-price').value = p.price;
                document.getElementById('p-image').value = p.image;
            } else {
                title.textContent = 'Добавить: ' + categoryNames[activeCategory];
                document.getElementById('edit-id').value = '';
            }
            updateModalPreview();
            modal.classList.remove('hidden');
        }

        function closeProductModal() {
            document.getElementById('product-modal').classList.add('hidden');
        }

        // Выбор фото из галереи iPhone с автоматическим сжатием
        function handleImageUpload(e) {
            const file = e.target.files && e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    const maxSide = 900;
                    const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
                    const canvas = document.createElement('canvas');
                    canvas.width = Math.max(1, Math.round(img.width * scale));
                    canvas.height = Math.max(1, Math.round(img.height * scale));

                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

                    const compressed = canvas.toDataURL('image/jpeg', 0.82);
                    document.getElementById('p-image').value = compressed;
                    updateModalPreview();
                };
                img.onerror = function() {
                    document.getElementById('p-image').value = event.target.result;
                    updateModalPreview();
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
            e.target.value = '';
        }

        function saveProduct(e) {
            e.preventDefault();
            const id = document.getElementById('edit-id').value;
            const name = document.getElementById('p-name').value.trim();
            const desc = document.getElementById('p-desc').value.trim();
            const price = Number(document.getElementById('p-price').value);
            const image = document.getElementById('p-image').value.trim() || defaultProducts[0].image;

            const prevProducts = [...products];

            if (id) {
                const idx = products.findIndex(p => p.id == id);
                if (idx !== -1) {
                    products[idx] = { id: Number(id), category: products[idx].category || 'rolls', name, desc, price, image };
                }
            } else {
                const newId = products.length > 0 ? Math.max(...products.map(p => p.id)) + 1 : 1;
                products.push({ id: newId, category: activeCategory, name, desc, price, image });
            }

            if (!saveProductsStorage()) {
                products = prevProducts;
                return;
            }
            closeProductModal();
            renderProducts();
        }

        function deleteProduct(id) {
            if (confirm('Удалить эту позицию?')) {
                products = products.filter(p => p.id !== id);
                saveProductsStorage();
                renderProducts();
            }
        }
    </script>
</body>
</html>
