<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>СУШИ КЛУБ</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f0e0d;
            color: #ffffff;
        }
        /* Вертикальная рамка под постер/фото, чтобы весь кадр помещался целиком */
        .product-image-box {
            width: 100%;
            aspect-ratio: 3 / 4;
            background-color: #11100f;
            overflow: hidden;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .product-image-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: center center;
            transition: transform 0.3s ease;
        }
        .product-card:hover .product-image-box img {
            transform: scale(1.03);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-amber-500 selection:text-black">

    <!-- Шапка сайта -->
    <header class="sticky top-0 z-40 bg-[#141210]/95 backdrop-blur-md border-b border-stone-800/80">
        <div class="max-w-3xl mx-auto px-4 h-16 flex items-center justify-between gap-2">
            <!-- Логотип -->
            <div class="flex items-center gap-2.5 cursor-pointer" onclick="scrollToTop()">
                <span class="text-2xl">🍣</span>
                <div class="leading-tight font-extrabold tracking-wide text-amber-400 text-sm sm:text-base uppercase">
                    СУШИ<br>КЛУБ
                </div>
            </div>

            <!-- Кнопки справа -->
            <div class="flex items-center gap-2">
                <button onclick="toggleAdminMode()" id="btn-admin-toggle" class="bg-[#1c1917] hover:bg-stone-800 border border-stone-700/80 text-stone-200 px-3.5 py-2 rounded-xl text-xs font-semibold flex flex-col items-center justify-center min-w-[82px] transition-colors">
                    <i class="fa-solid fa-lock text-amber-400 text-xs mb-0.5" id="admin-lock-icon"></i>
                    <span>Админка</span>
                </button>

                <button onclick="openCart()" class="relative bg-[#f59e0b] hover:bg-amber-400 text-black px-4 py-2 rounded-xl text-xs font-bold flex flex-col items-center justify-center min-w-[86px] shadow-lg shadow-amber-500/20 transition-all">
                    <i class="fa-solid fa-cart-shopping text-xs mb-0.5"></i>
                    <span>Корзина</span>
                    <span id="cart-badge" class="absolute -top-1.5 -right-1.5 bg-red-600 text-white text-[10px] font-extrabold w-5 h-5 rounded-full flex items-center justify-center shadow hidden">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Панель добавления нового товара (появляется после ввода кода 7777) -->
    <div id="admin-bar" class="hidden max-w-3xl mx-auto w-full px-4 pt-4">
        <div class="bg-[#181512] border border-amber-500/40 rounded-2xl p-3.5 flex items-center justify-between gap-3">
            <div class="text-xs text-amber-300 font-medium">
                <i class="fa-solid fa-shield-halved mr-1"></i> Режим редактирования включён
            </div>
            <div class="flex items-center gap-2">
                <button onclick="openProductModal()" class="bg-[#f59e0b] hover:bg-amber-400 text-black font-bold px-3.5 py-2 rounded-xl text-xs flex items-center gap-1.5 transition-colors">
                    <i class="fa-solid fa-plus"></i> Добавить ролл
                </button>
                <button onclick="toggleAdminMode()" class="bg-stone-800 hover:bg-stone-700 text-stone-200 font-semibold px-3 py-2 rounded-xl text-xs transition-colors">
                    Выйти
                </button>
            </div>
        </div>
    </div>
